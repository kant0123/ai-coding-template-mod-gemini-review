name: selfcheck

# **このテンプレートのリポジトリ自身を検査するワークフロー。**
# テンプレートをコピーして使う側には不要なので、コピー後は削除してよい
# (scripts/setup.sh / setup.ps1 も削除の対象にしている)。
#
# 収録物が壊れたまま配られるのを防ぐのが目的。実際、git 管理下に置く前に
# scripts/setup.ps1 の BOM 欠落を手作業で見つけている — それを機械に降ろしたもの。

on:
  push:
  pull_request:

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # wiki-lint が frontmatter の updated を最終コミット日と突き合わせるため、
          # 浅いクローンでは足りない(浅いと検査を黙って飛ばす)。
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: wiki-lint (収録している wiki の骨組み)
        run: node scripts/wiki-lint.js

      - name: シェルスクリプトの構文
        run: |
          status=0
          count=0
          while IFS= read -r file; do
            count=$((count + 1))
            bash -n "$file" || status=1
          done < <(find . -name '*.sh' -not -path './.git/*')
          echo "検査した .sh: $count 件"
          # 0 件で成功すると「通っているのに何も見ていない」状態に黙って落ちる。
          if [ "$count" -eq 0 ]; then
            echo "::error::検査対象の .sh が 1 件も見つからない(パスか除外条件が壊れている)"
            status=1
          fi
          exit $status

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python の構文
        run: |
          count=$(find . -name '*.py' -not -path './.git/*' | wc -l)
          echo "検査した .py: $count 件"
          # 0 件で成功すると「通っているのに何も見ていない」状態に黙って落ちる。
          if [ "$count" -eq 0 ]; then
            echo "::error::検査対象の .py が 1 件も見つからない(パスか除外条件が壊れている)"
            exit 1
          fi
          find . -name '*.py' -not -path './.git/*' -print0 | xargs -0 python -m py_compile

      - name: 合議制レビューのプレスキャナが実際に検出するか
        run: |
          # 収録しているサンプルには既知の Critical が仕込んである。
          # 「実行はできるが何も検出しない」状態で配られるのを防ぐための煙試験。
          set +e
          python review/panel_runner.py \
            --target review/examples/sample_target.py \
            --domain fintech --task-id selfcheck --fail-on-critical
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "::error::既知の欠陥を含むサンプルで Critical が 0 件だった(検出ロジックが壊れている)"
            exit 1
          fi
          echo "サンプルの既知欠陥を検出した (exit=$code)。"

      - name: PowerShell の構文
        shell: pwsh
        run: |
          $failed = $false
          $files = @(Get-ChildItem -Recurse -File -Include *.ps1, *.ps1.example)
          Write-Host "検査した PowerShell: $($files.Count) 件"
          # 0 件で成功すると「通っているのに何も見ていない」状態に黙って落ちる。
          if ($files.Count -lt 1) {
            Write-Host "::error::検査対象の .ps1 が 1 件も見つからない(パスか除外条件が壊れている)"
            exit 1
          }
          foreach ($file in $files) {
            $errors = $null
            # .example は拡張子が .ps1 でないため、内容を読んでパースする
            $text = Get-Content -LiteralPath $file.FullName -Raw
            [System.Management.Automation.Language.Parser]::ParseInput($text, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "::error file=$($file.FullName)::PowerShell パースエラー $($errors.Count) 件"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: .ps1 の BOM
        shell: pwsh
        run: |
          # BOM が無いと Windows PowerShell 5.1 が CP932 として読み、日本語が化けて
          # スクリプトが 1 行も実行されずパースエラーで落ちる。テンプレート自身の規約。
          $failed = $false
          $files = @(Get-ChildItem -Recurse -File -Include *.ps1, *.ps1.example)
          Write-Host "BOM を確認した PowerShell: $($files.Count) 件"
          if ($files.Count -lt 1) {
            Write-Host "::error::検査対象の .ps1 が 1 件も見つからない(パスか除外条件が壊れている)"
            exit 1
          }
          foreach ($file in $files) {
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)[0..2]
            if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
              Write-Host "::error file=$($file.FullName)::UTF-8 BOM が無い"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
